<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascension &amp; Mouflons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Permanent+Marker&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
  :root {
    --paper:#f1e7cf; --paper-light:#f9f1da; --paper-deep:#e3d4ad;
    --paper-edge:#c9b485; --paper-stain:#c8a96a;
    --ink:#2b1d12; --ink-soft:#5a4632; --ink-faded:#8a7458;
    --ink-red:#a8302a; --ink-blue:#2a4a6e; --ink-green:#3a5a3a;
    --gold:#c89d3f; --gold-deep:#8a6a20;
    --energy:#c8732a; --moral:#4a7ba8; --health:#a8302a;
    --wax-seal:#8b1e1e; --wax-seal-deep:#5a1212;
    --font-hand:'Caveat',cursive;
    --font-hand-bold:'Permanent Marker',cursive;
    --font-display:'IM Fell English SC',serif;
    --font-serif:'EB Garamond',Georgia,serif;
    --font-type:'Special Elite',monospace;
    --font-pixel:'VT323',monospace;
    --shadow-page:0 18px 40px -20px rgba(43,29,18,.55),0 4px 12px -6px rgba(43,29,18,.35);
    --shadow-card:0 8px 18px -10px rgba(43,29,18,.45),0 2px 4px -2px rgba(43,29,18,.25);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:var(--font-serif);color:var(--ink);background:#2a2014;line-height:1.55;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:rgba(43,29,18,.15)} ::-webkit-scrollbar-thumb{background:var(--ink-soft);border-radius:2px}

  /* ── Paper texture ── */
  .paper{position:relative;background:radial-gradient(ellipse 80% 60% at 30% 20%,rgba(255,255,255,.4),transparent 60%),radial-gradient(ellipse 60% 80% at 80% 80%,rgba(180,140,80,.18),transparent 65%),linear-gradient(180deg,var(--paper-light) 0%,var(--paper) 40%,var(--paper-deep) 100%);color:var(--ink);}
  .paper::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.17 0 0 0 0 0.11 0 0 0 0 0.07 0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");mix-blend-mode:multiply;opacity:.7;pointer-events:none;border-radius:inherit;z-index:0;}
  .paper::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 110% 90% at 50% 50%,transparent 60%,rgba(80,50,20,.18) 92%,rgba(50,30,10,.45) 100%);pointer-events:none;border-radius:inherit;z-index:0;}
  .paper>*{position:relative;z-index:1;}

  /* ── Stitches border ── */
  .deco-stitches{position:absolute;inset:12px;border:1px dashed rgba(43,29,18,.22);pointer-events:none;border-radius:4px;z-index:2;}

  /* ── Buttons ── */
  .btn{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;border:2px solid var(--ink);background:var(--paper-light);color:var(--ink);border-radius:3px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform 120ms,box-shadow 120ms;display:inline-block;line-height:1.2;}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:var(--paper-light);}
  .btn-red{border-color:var(--ink-red);color:var(--ink-red);box-shadow:3px 3px 0 var(--ink-red);}
  .btn-red:hover:not(:disabled){box-shadow:4px 4px 0 var(--ink-red);}
  .btn-green{border-color:var(--ink-green);color:var(--ink-green);box-shadow:3px 3px 0 var(--ink-green);}
  .btn-green:hover:not(:disabled){box-shadow:4px 4px 0 var(--ink-green);}
  .btn-sm{padding:4px 10px;font-size:10px;box-shadow:2px 2px 0 var(--ink);}

  /* ── Inputs ── */
  .input-field{font-family:var(--font-hand);font-size:20px;color:var(--ink);background:transparent;border:none;border-bottom:2px dashed var(--ink-soft);padding:4px 6px;outline:none;width:100%;display:block;}
  .input-field:focus{border-bottom-color:var(--ink-red);border-bottom-style:solid;}
  .input-field::placeholder{color:var(--ink-faded);}
  .die-input{font-family:var(--font-pixel);font-size:30px;color:var(--ink);background:rgba(43,29,18,.06);border:2px solid var(--ink-soft);border-radius:3px;padding:4px 8px;text-align:center;outline:none;width:84px;}
  .die-input:focus{border-color:var(--ink);}

  /* ── Stat bars ── */
  .bar{height:10px;background:rgba(43,29,18,.12);border:1px solid var(--ink-soft);border-radius:2px;overflow:hidden;position:relative;}
  .bar>span{display:block;height:100%;position:relative;transition:width 300ms;}
  .bar>span::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:rgba(255,255,255,.32);}
  .bar.energy>span{background:var(--energy);}
  .bar.moral>span{background:var(--moral);}

  /* ── Cards ── */
  .card{position:relative;background:radial-gradient(ellipse 90% 70% at 50% 0%,rgba(255,255,255,.4),transparent 60%),linear-gradient(180deg,var(--paper-light),var(--paper));border:1px solid var(--paper-edge);border-radius:3px;padding:14px 16px;box-shadow:var(--shadow-card);}

  /* ── Section label ── */
  .section-label{font-family:var(--font-display);font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px;letter-spacing:.05em;margin:0 0 10px;}
  .section-label::after{content:"";flex:1;height:1px;background:var(--ink);}

  /* ── Stamps / badges ── */
  .badge-ink{font-family:var(--font-type);font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:var(--ink);color:var(--paper-light);padding:3px 8px;}
  .badge-green{background:var(--ink-green);}
  .badge-gold{background:var(--gold-deep);}
  .badge-red{background:var(--ink-red);}

  /* ── Pixel art ── */
  .pixel,svg.pixel{image-rendering:pixelated;image-rendering:crisp-edges;}

  /* ── Scene box ── */
  .scene-box{width:100%;aspect-ratio:16/9;background:#0a0608;overflow:hidden;border:2px solid var(--ink);}

  /* ── Modals ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,12,6,.87);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-box{position:relative;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;}

  /* ── Inventory slots ── */
  .inv-slot{border:1px dashed var(--paper-edge);border-radius:2px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;background:rgba(43,29,18,.04);font-family:var(--font-type);font-size:9px;color:var(--ink-faded);text-align:center;gap:2px;}
  .inv-slot.filled{border-color:var(--paper-stain);background:rgba(200,157,63,.1);color:var(--ink);border-style:solid;}
  .inv-slot.wet{opacity:.5;}

  /* ── Photo effect for scene ── */
  .photo-frame{transform:rotate(-1.5deg);box-shadow:4px 4px 14px rgba(43,29,18,.4),0 0 0 6px var(--paper-light),0 0 0 7px var(--paper-edge);}

  /* ── KO ── */
  .player-ko{opacity:.5;}

  /* ── Narrative first-letter ── */
  .narrative p::first-letter{font-family:var(--font-display);font-size:2.8em;float:left;line-height:.82;margin:0 5px 0 0;color:var(--ink);}

  /* ── Responsive grids ── */
  .layout-master{display:grid;grid-template-columns:1fr 1fr 280px;gap:10px;align-items:start;}
  .layout-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .layout-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media(max-width:768px){
    .layout-master{grid-template-columns:1fr;}
    .layout-2col{grid-template-columns:1fr;}
    .layout-3col{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:480px){
    .layout-3col{grid-template-columns:1fr;}
  }

  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ═══════════════════════════════════════════════════════
// RESSOURCES
// ═══════════════════════════════════════════════════════
const RESOURCES = {
  sandwich:     { id:'sandwich',     name:'Sandwich',     icon:'🥪', hasPortions:true  },
  eau:          { id:'eau',          name:'Eau',          icon:'💧', hasPortions:true  },
  matelas:      { id:'matelas',      name:'Matelas',      icon:'🛏️', hasPortions:false },
  corde:        { id:'corde',        name:'Corde',        icon:'🪢', hasPortions:false, consumable:true },
  boussole:     { id:'boussole',     name:'Boussole',     icon:'🧭', hasPortions:false },
  chaufferette: { id:'chaufferette', name:'Chaufferette', icon:'🔥', hasPortions:false, consumable:true },
  lampe:        { id:'lampe',        name:'Lampe Torche', icon:'🔦', hasPortions:false },
  carte:        { id:'carte',        name:'Carte',        icon:'🗺️', hasPortions:false, consumable:true },

};

// ═══════════════════════════════════════════════════════
// CHAPITRES
// ═══════════════════════════════════════════════════════
const CHAPTERS = {
  1: {
    id:1, title:'Chapitre 1 — Le Camp de Base', altitude:0, day:1, weather:'☀️ Soleil',
    narrativeFull:`Les premières lueurs de l'aube embrasent les cimes du Kilimontferrier. Votre groupe se réunit autour du feu de camp, sacs à dos chargés, yeux brillants d'excitation et d'une pointe d'appréhension. Les villageois vous observent avec un mélange d'admiration et d'inquiétude.

L'air est pur, vivifiant. Une brise légère fait bruisser les drapeaux de prières ornant le camp. C'est votre Jour 1 sur 12 avant d'atteindre le sommet légendaire. Les montagnards locaux vous offrent du thé pendant que vous vérifiez votre équipement une dernière fois.`,
    narrativeSummary:`Jour 1 — Camp de Base (0 m) ☀️\nL'équipe se prépare au départ. Sacs vérifiés, moral au beau fixe. L'ascension commence ici.`,
    gmNotes:`📋 Rappel : chaque joueur commence avec 1 Sandwich (3 portions), 1 Eau (3 portions), 1 Matelas. Pas de fatigue ni de consommation ce chapitre. Lancez le D18 AVANT le choix de départ.`,
    d18Events:{
      low: { range:'1–6',   title:"⚠️ L'Avertissement",       story:`Un vieux montagnard aux yeux sages vous intercepte au départ. Il scrute le ciel d'un air grave : "Les nuages là-haut... je connais ce signe. Il y aura de la tempête sur la crête demain. Prenez garde." Il repart sans attendre votre réponse.`, effectDesc:`🚩 Drapeau TEMPÊTE activé. Au Chapitre 2, si le D18 tombe entre 7–12, les joueurs ne perdront PAS les 10 points de Moral (ils étaient psychologiquement préparés).`, effect:'flag_tempete' },
      mid: { range:'7–12',  title:"✅ Départ Paisible",         story:`Le départ se fait dans la bonne humeur. Quelques villageois font signe de la main, les enfants du village courent un bout de chemin avec vous avant de rebrousser chemin en riant. La journée s'annonce belle.`, effectDesc:`Aucun effet mécanique. Le groupe part sereinement.`, effect:null },
      high:{ range:'13–18', title:"☕ La Générosité du Sherpa", story:`Un sherpa à la carrure imposante et au sourire chaleureux vous rattrape juste avant le départ. Il tend un Thermos brillant : "Du thé de yak spécial, préparé par ma mère. Ça garde chaud et ça remonte le moral. Prenez-en soin." Il salue et disparaît dans le village.`, effectDesc:`☕ Le groupe reçoit 1 Thermos. Utilisable 1 fois : +10 Moral à TOUS. 1 emplacement d'inventaire. L'hôte choisit qui le porte.`, effect:'give_thermos' },
    },
    choices:[
      { id:1, label:'Partir léger et vite',  description:'Vous vous élancez sans cérémonie, économisant vos forces.', effects:[], alwaysAvailable:true },
      { id:2, label:'Cérémonie de départ',   description:'Bénédiction avec les locaux. Si un joueur tombe à 0 Énergie, l\'équipe gagne +5 Moral.', effects:[{type:'add_bonus_moral_all'}], alwaysAvailable:true },
      { id:3, label:'Consulter la carte',    description:'Étude approfondie du terrain. -5 Énergie pour tous, mais vous obtenez une Carte qui débloque une route secrète au Chapitre 4.', effects:[{type:'energy_all',value:-5},{type:'give_carte_one'},{type:'flag_carte_consulted'}], alwaysAvailable:true },
    ],
    consumption:[], fatigue:0,
  },
  2: {
    id:2, title:"Chapitre 2 — La Forêt S'Épaissit", altitude:500, day:2, weather:'🌧️ Pluie',
    narrativeFull:`La forêt referme ses bras sur vous comme un cocon vert et humide. La pluie commence — d'abord un murmure sur les feuilles, puis un tambour persistant. Les sentiers se transforment en ruisseaux de boue. Chaque pas est une négociation avec le sol.

La végétation est dense, presque impénétrable par endroits. Des fougères géantes vous fouettent le visage, des racines noueuses guettent vos chevilles. La montée à 500m révèle déjà la nature sauvage du Kilimontferrier.`,
    narrativeSummary:`Jour 2 — Forêt (500 m) 🌧️\nLa pluie s'installe. La forêt dense ralentit la progression. L'équipe avance malgré la boue et la fatigue.`,
    gmNotes:`📋 Appliquez en avançant : -5 Énergie (fatigue) + 1 portion de sandwich par joueur (consommation). L'effet du D18 mid dépend du flag TEMPÊTE du Ch.1. Thermos utilisable ici : +10 Moral tous, consomme le Thermos.`,
    d18Events:{
      low: { range:'1–6',   title:"🦌 Le Chamois Surprise",    story:`Un chamois surgit des buissons avec un cri strident, bondissant littéralement au milieu du groupe. Tout le monde lâche un cri, quelqu'un trébuche, quelqu'un renverse sa gourde. Le chamois disparaît en trois bonds gracieux, indifférent au chaos qu'il a semé.`, effectDesc:`-5 Moral pour TOUS les joueurs actifs.`, effect:'moral_minus5_all' },
      mid: { range:'7–12',  title:"🌧️ La Pluie Redouble",      story:`[Si TEMPÊTE activé] : "Le vieux avait raison... la pluie redouble. Au moins vous l'aviez anticipé." Moral inchangé.\n[Si TEMPÊTE NON activé] : Le ciel ouvre soudain ses vannes. En quelques secondes, tout le groupe est trempé jusqu'aux os. La déception s'ajoute au froid.`, effectDesc:`Si flag TEMPÊTE activé → Aucun effet. Si NON activé → -10 Moral pour TOUS (surprise).`, effect:'moral_minus10_if_no_warning' },
      high:{ range:'13–18', title:"🪨 La Grotte Providentielle", story:`Entre deux rochers couverts de mousse, une ouverture sombre. Une grotte ! À l'intérieur, sec et à l'abri du vent, quelqu'un a laissé des provisions de survie... et une lampe torche oubliée dans un coin. Vous prenez le temps de souffler et de sécher vos affaires.`, effectDesc:`+5 Énergie pour TOUS. Le groupe reçoit 1 Lampe Torche. L'hôte choisit qui la porte.`, effect:'energy_plus5_all_give_lampe' },
    },
    choices:[
      { id:1, label:'Continuer droit',  description:"Vous poussez de l'avant sans vous arrêter. Pas d'impact supplémentaire.", effects:[], alwaysAvailable:true },
      { id:2, label:'Trouver un abri', description:"Vous cherchez un abri pour la nuit. Vous récupérez, mais perdez du temps : -10 Énergie supplémentaires pour tous au Chapitre 3.", effects:[{type:'flag_abri_ch2'}], alwaysAvailable:true },
    ],
    consumption:[{resource:'sandwich',portions:1,perPlayer:true}], fatigue:-5,
  },
  3: {
    id:3, title:'Chapitre 3 — La Forêt Révèle ses Secrets', altitude:1000, day:3, weather:'☁️ Nuageux',
    narrativeFull:`La forêt prend une dimension mystérieuse dans la lumière grise du matin. Les arbres s'élèvent comme des colonnes de cathédrale, et vos voix résonnent étrangement dans ce silence habité.

La montée devient plus prononcée. Vos mollets brûlent, votre souffle se fait plus court. Des craquements inexpliqués autour de vous... des silhouettes furtives entre les troncs. La forêt a ses propres règles ici.`,
    narrativeSummary:`Jour 3 — Forêt profonde (1 000 m) ☁️\nLa montée s'intensifie dans une forêt mystérieuse. L'altitude commence à se faire sentir.`,
    gmNotes:`📋 Appliquez en avançant : -8 Énergie (+ -10 si abri pris au Ch.2) + 1 portion de sandwich par joueur. Si D18 haut (13-18) et qu'un joueur entre dans le refuge, lancez D6 : 1-2 = -10 Énergie 1 joueur ; 3-4 = +Corde ; 5-6 = +Corde et +Chaufferette.`,
    d18Events:{
      low: { range:'1–6',   title:"🦫 Les Marmottes Moqueurs",  story:`Les marmottes du coin semblent décidées à vous humilier. Leurs sifflements sonores ressemblent étrangement à des rires... Le joueur qui ose faire la blague la plus nulle sur les marmottes les nargue en retour mais y laisse sa dignité.`, effectDesc:`-5 Moral pour 1 joueur (auto-désigné : celui qui fait la blague la plus nulle). Les autres désignent.`, effect:'moral_minus5_one' },
      mid: { range:'7–12',  title:"✅ Montée Tranquille",        story:`La forêt reste dense mais la progression se fait sans encombre. Vos pieds trouvent naturellement les bons appuis, votre souffle s'adapte au rythme de la montée. Un bon moment.`, effectDesc:`Aucun effet mécanique.`, effect:null },
      high:{ range:'13–18', title:"🪨 Le Refuge Secret",         story:`Un passage étroit entre deux rochers. Une indication gravée : REFUGE. À l'intérieur, à peine assez grand pour une personne... mais qui sait ce qu'il cache ? Un joueur peut tenter de s'y faufiler. Lancez D6 si oui.`, effectDesc:`Un joueur choisit d'entrer (optionnel). Si oui, D6 : 1-2 = passage trop serré (-10 Énergie ce joueur) ; 3-4 = +Corde ; 5-6 = +Corde ET +Chaufferette (+5 Énergie +5 Moral quand utilisée).`, effect:'refuge_choice' },
    },
    choices:[
      { id:1, label:'Continuer vers les hauteurs', description:"Vous gardez le cap sans dévier. Aucun impact.", effects:[], alwaysAvailable:true },
      { id:2, label:'Explorer les alentours',      description:"Vous fouillez la forêt. -5 Énergie pour tous, mais vous trouvez 3 portions de sandwich (1 par joueur, 3 joueurs max).", effects:[{type:'energy_all',value:-5},{type:'give_sandwiches_3'}], alwaysAvailable:true },
      { id:3, label:'Accélérer le pas',            description:"Un joueur est désigné Meneur. Les autres peinent à suivre : -5 Énergie pour tous sauf le Meneur.", effects:[{type:'energy_others',value:-5}], alwaysAvailable:true },
    ],
    consumption:[{resource:'sandwich',portions:1,perPlayer:true}], fatigue:-8, fatigueAbri:-10,
  },
  4: {
    id:4, title:'Chapitre 4 — La Traversée du Torrent', altitude:1300, day:4, weather:'☀️ Soleil',
    narrativeFull:`Vous entendez le torrent avant de le voir — un grondement sourd qui enfle à mesure que vous approchez. Puis il apparaît : une rivière tumultueuse, les eaux glaciales bondissant d'un rocher à l'autre.

Trois options s'offrent à vous. Et pour ceux qui ont étudié la carte... une quatrième, secrète.`,
    narrativeSummary:`Jour 4 — Le Torrent (1 300 m) ☀️\nUn torrent impétueux barre la route. Le groupe doit décider comment le franchir.`,
    gmNotes:`📋 Appliquez en avançant : -12 Énergie + 1 portion de sandwich par joueur. Choix 3 (Corde) disponible seulement si quelqu'un a une Corde. Choix 4 (Carte) disponible seulement si flag carte_consulted ET quelqu'un a une Carte. Si Choix 4 : combat D6 ours, puis saut Chapitre 6.`,
    d18Events:{
      low: { range:'1–6',   title:"💧 La Glissade",              story:`L'un de vous pose le pied sur une pierre trop glissante. Un cri, une chute, une éclaboussure. Personne n'est blessé... mais une ressource spécialisée (hors nourriture) est emportée par le courant.`, effectDesc:`-5 Moral pour 1 joueur (désignez le glisseur). Ce joueur perd 1 ressource spécialisée (pas nourriture/eau) — l'hôte retire l'objet dans l'inventaire.`, effect:'glissade' },
      mid: { range:'7–12',  title:"✅ Traversée Sans Accroc",     story:`Les pieds dans l'eau glaciale, les dents serrées, vous franchissez le torrent sans incident majeur. Personne ne tombe, rien n'est perdu. L'eau est froide mais le soulagement est immense.`, effectDesc:`Aucun effet mécanique.`, effect:null },
      high:{ range:'13–18', title:"🐟 Les Truites Magnifiques",   story:`Des truites arc-en-ciel bondissent hors de l'eau à vos pieds — un spectacle enchanteur dans le soleil. L'une d'elles fait pratiquement signe de la main. Dans les rochers, quelqu'un a oublié une boussole.`, effectDesc:`+10 Moral pour TOUS. Le groupe reçoit 1 Boussole. L'hôte choisit qui la porte.`, effect:'moral_plus10_all_give_boussole' },
    },
    choices:[
      { id:1, label:'Traverser en ligne directe', description:'Cap droit devant à gué. Aucun effet supplémentaire.', effects:[], alwaysAvailable:true },
      { id:2, label:'Point de traversée sûr',     description:"Vous cherchez un passage plus calme en amont. -8 Énergie supplémentaires, mais +5 Moral (fierté de la prudence).", effects:[{type:'energy_all',value:-8},{type:'moral_all',value:5}], alwaysAvailable:true },
      { id:3, label:'Utiliser la Corde 🪢',        description:"Tendez la corde pour sécuriser le passage. -5 Énergie (au lieu de -12), +10 Moral. La Corde est consommée.", effects:[{type:'energy_all',value:-5},{type:'moral_all',value:10},{type:'consume_corde'}], requiresResource:'corde' },

    consumption:[{resource:'sandwich',portions:1,perPlayer:true}], fatigue:-12,

const MAX_SLOTS = 6;

const createInitialState = (playerNames, costumes=[]) => ({
  currentChapter:1, currentDay:1, currentAltitude:0,
  flags:{}, choiceMade:false, lastChoiceLabel:null,
  d18EventApplied:false, lastD18Result:null, lastD18Title:null,
  pendingItemGrants:[],
  pendingRefugeDecision:null,
  interChapterSummary:null,
  players: playerNames.map((name,i) => ({
    id:i, name, role: costumes[i]?.role||'', energy:100, moral:100, isKO:false, bonusMoral:false,
    costume: costumes[i] ? {hat:costumes[i].hat,shirt:costumes[i].shirt,shoes:costumes[i].shoes} : {...DEFAULT_COSTUME},
    inventory:[
      {resourceId:'sandwich',portions:3,wet:false},
      {resourceId:'eau',portions:3,wet:false},
      {resourceId:'matelas',portions:null,wet:false},
    ],
  })),
  gameOver:false, gameOverReason:null,
});

const saveState = (s) => { try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(s)); localStorage.setItem(STORAGE_KEY+'_ts',Date.now()); }catch(e){} };
const loadState = () => { try{ const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; }catch(e){return null;} };
const clearState = () => { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(STORAGE_KEY+'_ts'); };

// HELPERS
// ═══════════════════════════════════════════════════════
const getRes = (id) => RESOURCES[id];
const getUsedSlots = (inv) => inv.filter(i => !getRes(i.resourceId)?.noSlot).length;
const consumeFrom = (player, resId, qty) => {
  let rem = qty;
  const inv = [...player.inventory];
  for (let i=0; i<inv.length && rem>0; i++) {
    const it = inv[i];
    if (it.resourceId === resId && !it.wet) {
      if (it.portions !== null) {
        const take = Math.min(it.portions, rem);
        inv[i] = {...it, portions:it.portions-take};
        rem -= take;
        if (inv[i].portions <= 0) inv.splice(i--,1);
      } else { inv.splice(i--,1); rem--; }
    }
  }
  return inv;
};
const isChoiceAvail = (choice, gs) => {
  if (choice.requiresResource) {
    if (!gs.players.some(p => !p.isKO && p.inventory.some(i => i.resourceId===choice.requiresResource && !i.wet))) return false;
  }
  if (choice.requiresFlag && !gs.flags[choice.requiresFlag]) return false;
  return true;
};
const chEmoji = (ch) => ({1:'🏕️',2:'🌲',3:'🌿',4:'🌊',5:'🏔️',6:'🦅'}[ch]||'⛰️');

// APP
// ═══════════════════════════════════════════════════════
function App() {
  const [view, setView] = useState('home');
  const [gs, setGs] = useState(null);
  const [pendingNames, setPendingNames] = useState([]);

  useEffect(() => {
    const h = (e) => { if(e.key===STORAGE_KEY){ const s=loadState(); if(s) setGs(s); } };
    window.addEventListener('storage',h);
    return () => window.removeEventListener('storage',h);
  },[]);

  useEffect(() => {
    if (view!=='player') return;
    const t = setInterval(() => {
      const s = loadState();
      if (s) setGs(p => JSON.stringify(s)!==JSON.stringify(p)?s:p);
    }, 500);
    return () => clearInterval(t);
  },[view]);

  const upd = useCallback((fn) => {
    setGs(p => { const n=typeof fn==='function'?fn(p):fn; saveState(n); return n; });
  },[]);

  const start = (names, costumes) => { const s=createInitialState(names, costumes); saveState(s); setGs(s); setView('master'); };
  const reset = () => { clearState(); setGs(null); setView('home'); };

  if (view==='home')      return <HomeScreen onNew={()=>setView('setup')} onMaster={()=>{const s=loadState();if(s){setGs(s);setView('master');}else alert('Aucune partie.')}} onPlayer={()=>{const s=loadState();if(s){setGs(s);setView('player');}else alert('Aucune partie.')}} />;
  if (view==='setup')     return <SetupScreen onNext={(names)=>{setPendingNames(names);setView('customize');}} onBack={()=>setView('home')} />;
  if (view==='customize') return <CharacterCustomizeScreen names={pendingNames} onStart={start} onBack={()=>setView('setup')} />;
  if (view==='master' && gs) return <MasterScreen gs={gs} upd={upd} onReset={reset} onPlayer={()=>setView('player')} />;
  if (view==='player' && gs) return <PlayerScreen gs={gs} onBack={()=>setView('home')} />;
  return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-type)',color:'var(--ink-faded)',fontSize:'14px',letterSpacing:'.1em'}}>Chargement...</div>;
}

// ═══════════════════════════════════════════════════════
// MASTER SCREEN
// ═══════════════════════════════════════════════════════
function MasterScreen({gs,upd,onReset,onPlayer}) {
  const [showInvModal,setShowInvModal] = useState(null);
  const [log,setLog] = useState([]);
  const [bearScores,setBearScores] = useState({});
  const [bearOurs,setBearOurs] = useState('');
  const [showBear,setShowBear] = useState(false);

  const ch = CHAPTERS[gs.currentChapter];
  const addLog = (msg) => setLog(p=>[`[Ch.${gs.currentChapter}] ${msg}`,...p].slice(0,30));

  // ── D18 EVENT ──
  const applyD18 = (roll) => {
    const evt = roll<=6?ch.d18Events.low:roll<=12?ch.d18Events.mid:ch.d18Events.high;
    addLog(`D18=${roll} → ${evt.title}`);
    upd(prev => {
      let next = {...prev, d18EventApplied:true, lastD18Result:roll, lastD18Title:evt.title};
      const players = prev.players.map(p=>({...p,inventory:[...p.inventory]}));
      const grants = [...(prev.pendingItemGrants||[])];

      if (ch.id===1) {
        if (evt.effect==='flag_tempete') next.flags={...next.flags,tempete:true};
        if (evt.effect==='give_thermos') grants.push({resourceId:'thermos',source:'Sherpa du camp de base'});
      }
      if (ch.id===2) {
        if (evt.effect==='moral_minus5_all') players.forEach(p=>{if(!p.isKO)p.moral=Math.max(0,p.moral-5);});
        if (evt.effect==='moral_minus10_if_no_warning' && !prev.flags.tempete) players.forEach(p=>{if(!p.isKO)p.moral=Math.max(0,p.moral-10);});
        if (evt.effect==='energy_plus5_all_give_lampe') {
          players.forEach(p=>{if(!p.isKO)p.energy=Math.min(100,p.energy+5);});
          grants.push({resourceId:'lampe',source:'Grotte providentielle'});
        }
      }
      if (ch.id===3) {
        if (evt.effect==='moral_minus5_one') addLog('Désignez le joueur qui perd 5 Moral (blague la plus nulle).');
        if (evt.effect==='refuge_choice') next.pendingRefugeDecision = { phase:'decide', selectedPlayerId:null };
      }
      if (ch.id===4) {
        if (evt.effect==='glissade') addLog("Désignez le joueur qui glisse : -5 Moral + retirez 1 ressource spécialisée (hors nourriture) dans son inventaire via ✏️.");
        if (evt.effect==='moral_plus10_all_give_boussole') {
          players.forEach(p=>{if(!p.isKO)p.moral=Math.min(100,p.moral+10);});
          grants.push({resourceId:'boussole',source:'Rochers du torrent'});
        }
      }
      return {...next, players, pendingItemGrants:grants};
    });
  };

  // ── CHOICE ──
  const applyChoice = (choiceId) => {
    const choice = ch.choices.find(c=>c.id===choiceId);
    if (!choice) return;
    addLog(`Choix ${choiceId} : "${choice.label}"`);
    upd(prev => {
      let next = {...prev, choiceMade:true, lastChoiceLabel:choice.label};
      const players = prev.players.map(p=>({...p,inventory:[...p.inventory]}));
      const grants = [...(prev.pendingItemGrants||[])];

      for (const eff of choice.effects) {
        if (eff.type==='energy_all')         players.forEach(p=>{if(!p.isKO)p.energy=Math.max(0,Math.min(100,p.energy+eff.value));});
        if (eff.type==='moral_all')           players.forEach(p=>{if(!p.isKO)p.moral=Math.max(0,Math.min(100,p.moral+eff.value));});
        if (eff.type==='add_bonus_moral_all') players.forEach(p=>{if(!p.isKO)p.bonusMoral=true;});
        if (eff.type==='give_carte_one')      grants.push({resourceId:'carte',source:'Étude de la carte (Ch.1)'});
        if (eff.type==='flag_carte_consulted') next.flags={...next.flags,flag_carte_consulted:true};
        if (eff.type==='give_sandwiches_3') {
          let given=0;
          for(const p of players){if(!p.isKO&&given<3){p.inventory=[...p.inventory,{resourceId:'sandwich',portions:1,wet:false}];given++;}}
        }
        if (eff.type==='consume_corde') {
          for(const p of players){const idx=p.inventory.findIndex(i=>i.resourceId==='corde');if(idx!==-1){p.inventory.splice(idx,1);break;}}
        }
        if (eff.type==='flag_abri_ch2') next.flags={...next.flags,abri_ch2:true};
        if (eff.type==='bear_fight') { next.flags={...next.flags,bearFight:true}; setShowBear(true); }
      }
      players.forEach(p=>{if(p.energy<=0)p.isKO=true;});
      const allKO=players.every(p=>p.isKO);
      const avgMoral=players.reduce((s,p)=>s+p.moral,0)/players.length;
      return {...next,players,pendingItemGrants:grants,gameOver:allKO||avgMoral<=0,gameOverReason:allKO?'Tous les joueurs sont évanouis !':avgMoral<=0?'Le moral collectif est à zéro — abandon !':null};
    });
  };

  // ── GRANT ITEM ──
  const grantItem = (playerId) => {
    const grant = gs.pendingItemGrants[0];
    upd(prev => {
      const players = prev.players.map(p => {
        if (p.id!==playerId) return p;
        return {...p, inventory:[...p.inventory,{resourceId:grant.resourceId,portions:getRes(grant.resourceId)?.hasPortions?3:null,wet:false}]};
      });
      return {...prev, players, pendingItemGrants:prev.pendingItemGrants.slice(1)};
    });
    addLog(`${getRes(grant.resourceId)?.icon} ${getRes(grant.resourceId)?.name} remis à ${gs.players.find(p=>p.id===playerId)?.name}`);
  };

  // ── BEAR FIGHT ──
  const applyBear = () => {
    const ours = parseInt(bearOurs);
    if (isNaN(ours)) return;
    upd(prev => {
      const players = prev.players.map(p => {
        if (p.isKO) return p;
        const ps = bearScores[p.id]?parseInt(bearScores[p.id]):0;
        const ne = ps<ours?Math.max(0,p.energy-5):p.energy;
        return {...p,energy:ne,isKO:ne<=0};
      });
      for(const p of players){const idx=p.inventory.findIndex(i=>i.resourceId==='carte');if(idx!==-1){p.inventory.splice(idx,1);break;}}
      return {...prev,players,choiceMade:true,lastChoiceLabel:"Chemin de l'Ouest (Ours combattu)",currentChapter:6};
    });
    setShowBear(false);
    addLog(`Combat ours (score ours: ${ours}). Résultats appliqués. Saut Ch.6`);
  };

  // ── ADVANCE CHAPTER ──
  const advance = () => {
    const nextId = gs.currentChapter+1;
    if (!CHAPTERS[nextId]) { addLog('Fin de la V1 — bravo !'); return; }
    const nch = CHAPTERS[nextId];
    const events = [];
    events.push({icon:'📅',text:`Jour ${nch.day}/12 — ${nch.title}`});
    events.push({icon:'📍',text:`Altitude : ${gs.currentAltitude} m → ${nch.altitude} m`});
    events.push({icon:nch.weather,text:`Météo : ${nch.weather}`});
    if (nch.fatigue) events.push({icon:'⚡',text:`Fatigue de l'étape : ${Math.abs(nch.fatigue)} points d'Énergie perdus pour tous`});
    if (nextId===3 && gs.flags.abri_ch2 && nch.fatigueAbri) events.push({icon:'😴',text:`Pénalité abri (Ch.2) : ${Math.abs(nch.fatigueAbri)} points d'Énergie supplémentaires`});
    if (nch.consumption?.length) events.push({icon:'🥪',text:`Consommation : 1 portion de sandwich par joueur actif`});
    if (gs.lastD18Title) events.push({icon:'🎲',text:`Événement D18 : ${gs.lastD18Title}`});
    if (gs.lastChoiceLabel) events.push({icon:'🎯',text:`Choix effectué : ${gs.lastChoiceLabel}`});
    upd(prev => {
      const players=prev.players.map(p=>({...p,inventory:[...p.inventory]}));
      let fat=nch.fatigue||0;
      if(nextId===3&&prev.flags.abri_ch2)fat+=nch.fatigueAbri||0;
      players.forEach(p=>{if(!p.isKO)p.energy=Math.max(0,p.energy+fat);});
      for(const c of(nch.consumption||[])){if(c.perPlayer)players.forEach(p=>{if(!p.isKO)p.inventory=consumeFrom(p,c.resource,c.portions);});}
      players.forEach(p=>{if(p.energy<=0)p.isKO=true;});
      return {...prev,currentChapter:nextId,currentDay:nch.day,currentAltitude:nch.altitude,players,choiceMade:false,lastChoiceLabel:null,d18EventApplied:false,lastD18Result:null,lastD18Title:null,pendingItemGrants:[],interChapterSummary:{events}};
    });
  };

  const statChange = (pid,stat,delta) => upd(prev=>({...prev,players:prev.players.map(p=>p.id===pid?{...p,[stat]:Math.max(0,Math.min(100,p[stat]+delta))}:p)}));

  if (gs.gameOver) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}}>
      <div className="paper" style={{maxWidth:'400px',width:'100%',borderRadius:'4px',padding:'48px 36px',textAlign:'center',boxShadow:'var(--shadow-page)',position:'relative'}}>
        <div className="deco-stitches"/>
        <div style={{fontFamily:'var(--font-pixel)',fontSize:'80px',lineHeight:1}}>✝</div>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:'28px',color:'var(--ink-red)',margin:'16px 0 12px',letterSpacing:'.04em'}}>Fin de Partie</h2>
        <p style={{fontFamily:'var(--font-serif)',fontSize:'16px',marginBottom:'28px',color:'var(--ink-soft)'}}>{gs.gameOverReason}</p>
        <button onClick={onReset} className="btn btn-red">Nouvelle Partie</button>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:'#2a2014',padding:'10px'}}>

      {/* HEADER */}
      <div className="paper" style={{borderRadius:'3px',padding:'10px 16px',marginBottom:'10px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'8px',position:'relative',boxShadow:'var(--shadow-card)'}}>
        <div style={{fontFamily:'var(--font-display)',fontSize:'15px',letterSpacing:'.05em',color:'var(--ink)'}}>Régie — Ascension &amp; Mouflons</div>
        <div style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}}>
          <span className="badge-ink">Jour {gs.currentDay}/12</span>
          <span className="badge-ink badge-green">{gs.currentAltitude}m</span>
          <span style={{fontFamily:'var(--font-type)',fontSize:'12px',color:'var(--ink-soft)'}}>{ch?.weather}</span>
          {gs.interChapterSummary&&<span className="badge-ink badge-gold">📋 Résumé joueurs</span>}
          <button onClick={onPlayer} className="btn btn-sm btn-green">Vue Joueurs</button>
          <button onClick={onReset} className="btn btn-sm btn-red">Reset</button>
        </div>
      </div>

      {gs.interChapterSummary&&(
        <div style={{marginBottom:'10px',background:'rgba(200,157,63,.12)',border:'1px solid var(--gold)',borderRadius:'3px',padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}>
          <span style={{fontFamily:'var(--font-type)',fontSize:'12px',color:'var(--gold-deep)'}}>📋 Les joueurs voient le résumé. Cliquez Continuer quand ils sont prêts.</span>
          <button onClick={()=>upd(p=>({...p,interChapterSummary:null}))} className="btn btn-sm btn-green">Continuer →</button>
        </div>
      )}

      <div className="layout-master">
        {/* LEFT + MIDDLE */}
        <div className="main-cols" style={{gridColumn:'1/3',display:'flex',flexDirection:'column',gap:'10px'}}>

          {/* NARRATION */}
          <div className="card">
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'12px',gap:'8px'}}>
              <div style={{fontFamily:'var(--font-display)',fontSize:'16px',letterSpacing:'.04em',color:'var(--ink)'}}>{ch?.title}</div>
              <button onClick={advance}
                disabled={!gs.choiceMade||gs.pendingItemGrants?.length>0||!!gs.pendingRefugeDecision}
                className={`btn btn-sm${gs.choiceMade&&!gs.pendingItemGrants?.length&&!gs.pendingRefugeDecision?' btn-primary':''}`}
                style={{flexShrink:0}}>
                ⏭ Chapitre Suivant
              </button>
            </div>
            <div className="layout-2col" style={{gap:'14px'}}>
              <div>
                <div style={{fontFamily:'var(--font-type)',fontSize:'10px',letterSpacing:'.12em',color:'var(--ink-blue)',marginBottom:'6px',textTransform:'uppercase'}}>À lire aux joueurs</div>
                <p style={{fontFamily:'var(--font-serif)',fontSize:'14px',lineHeight:'1.65',whiteSpace:'pre-line',color:'var(--ink)'}}>{ch?.narrativeFull}</p>
              </div>
              <div style={{background:'rgba(43,29,18,.05)',border:'1px solid var(--paper-edge)',borderRadius:'2px',padding:'10px 12px'}}>
                <div style={{fontFamily:'var(--font-type)',fontSize:'10px',letterSpacing:'.12em',color:'var(--energy)',marginBottom:'6px',textTransform:'uppercase'}}>Notes du Narrateur</div>
                <p style={{fontFamily:'var(--font-type)',fontSize:'12px',lineHeight:'1.55',color:'var(--ink-soft)'}}>{ch?.gmNotes}</p>
              </div>
            </div>
          </div>

          {/* D18 */}
          <D18Panel chapter={ch} onApply={applyD18} appliedResult={gs.lastD18Result} />

          {/* D6 NOTE */}
          <div className="card" style={{display:'flex',alignItems:'flex-start',gap:'10px',padding:'10px 14px'}}>
            <span style={{fontFamily:'var(--font-pixel)',fontSize:'26px',lineHeight:1,flexShrink:0}}>⚄</span>
            <div style={{fontFamily:'var(--font-type)',fontSize:'11px',lineHeight:'1.65',color:'var(--ink-soft)'}}>
              <span style={{fontFamily:'var(--font-display)',fontSize:'13px',color:'var(--energy)'}}>D6 — Quand l'utiliser ?</span><br/>
              Ch.3 Refuge (D18 13–18) : fenêtre automatique avec D6 intégré.<br/>
              Ch.4 Combat ours (Choix 4) : panneau combat via le bouton de choix.
            </div>
          </div>

          {/* CHOICES */}
          <div className="card">
            <div className="section-label" style={{color:'var(--ink-green)'}}>Choix du Chapitre</div>
            <div className="layout-2col">
              {ch?.choices.map(choice=>{
                const avail=isChoiceAvail(choice,gs);
                const done=gs.choiceMade;
                return (
                  <button key={choice.id}
                    onClick={()=>avail&&!done&&applyChoice(choice.id)}
                    disabled={!avail||done}
                    style={{padding:'10px 12px',textAlign:'left',border:`2px solid ${done?'var(--paper-edge)':avail?'var(--ink-green)':'var(--paper-edge)'}`,background:done?'transparent':avail?'rgba(58,90,58,.08)':'transparent',borderRadius:'2px',cursor:avail&&!done?'pointer':'not-allowed',opacity:!avail||done?.7:1,transition:'border-color 120ms,background 120ms'}}>
                    <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',marginBottom:'3px'}}>Choix {choice.id}</div>
                    <div style={{fontFamily:'var(--font-display)',fontSize:'13px',color:avail&&!done?'var(--ink)':'var(--ink-faded)',marginBottom:'4px'}}>{choice.label}</div>
                    <div style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-soft)',lineHeight:'1.4'}}>{choice.description}</div>
                    {!avail&&<div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-red)',marginTop:'4px'}}>🔒 {choice.requiresResource&&getRes(choice.requiresResource)?.name}{choice.requiresFlag?' + carte consultée':''}</div>}
                  </button>
                );
              })}
            </div>
            {gs.choiceMade&&<p style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-green)',marginTop:'8px',textAlign:'center'}}>✓ "{gs.lastChoiceLabel}" — En attente distribution des objets.</p>}
          </div>

          {/* LOG */}
          <div className="card">
            <div className="section-label" style={{color:'var(--ink-faded)'}}>Journal de Session</div>
            <div style={{maxHeight:'120px',overflowY:'auto',display:'flex',flexDirection:'column',gap:'3px'}}>
              {log.length===0
                ?<p style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-faded)',fontStyle:'italic'}}>Aucun événement.</p>
                :log.map((l,i)=><div key={i} style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-soft)',background:'rgba(43,29,18,.04)',padding:'3px 8px',borderLeft:'2px solid var(--paper-edge)'}}>{l}</div>)
              }
            </div>
          </div>
        </div>

        {/* RIGHT: PLAYERS */}
        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
          <div className="section-label" style={{justifyContent:'center'}}>Joueurs</div>
          {gs.players.map(p=>(
            <MasterPlayerCard key={p.id} player={p} onEdit={()=>setShowInvModal(p.id)} onStat={(s,d)=>statChange(p.id,s,d)} />
          ))}
        </div>
      </div>

      {/* ITEM GRANT MODAL */}
      {gs.pendingItemGrants?.length>0&&!gs.pendingRefugeDecision&&(
        <ItemGrantModal grant={gs.pendingItemGrants[0]} players={gs.players} onGrant={grantItem} remaining={gs.pendingItemGrants.length}/>
      )}

      {/* REFUGE MODAL */}
      {gs.pendingRefugeDecision&&(
        <RefugeModal
          decision={gs.pendingRefugeDecision}
          players={gs.players}
          onDecide={(playerId)=>{
            if(playerId===null){addLog("Refuge : personne n'entre.");upd(prev=>({...prev,pendingRefugeDecision:null}));}
            else upd(prev=>({...prev,pendingRefugeDecision:{phase:'roll',selectedPlayerId:playerId}}));
          }}
          onApplyD6={(playerId,roll)=>{
            upd(prev=>{
              const players=prev.players.map(p=>({...p,inventory:[...p.inventory]}));
              const grants=[...(prev.pendingItemGrants||[])];
              if(roll<=2){const t=players.find(p=>p.id===playerId);if(t){t.energy=Math.max(0,t.energy-10);t.isKO=t.energy<=0;}}
              else if(roll<=4)grants.push({resourceId:'corde',source:'Refuge secret (Ch.3)'});
              else{grants.push({resourceId:'corde',source:'Refuge secret (Ch.3)'});grants.push({resourceId:'chaufferette',source:'Refuge secret (Ch.3)'});}
              return{...prev,players,pendingItemGrants:grants,pendingRefugeDecision:null};
            });
            const pName=gs.players.find(p=>p.id===playerId)?.name;
            addLog(`Refuge D6=${roll} — ${roll<=2?`-10 Énergie → ${pName}`:roll<=4?'+Corde → à distribuer':'+Corde +Chaufferette → à distribuer'}`);
          }}
        />
      )}

      {/* BEAR FIGHT MODAL */}
      {showBear&&(
        <div className="modal-overlay">
          <div className="modal-box">
            <div className="paper" style={{borderRadius:'4px',padding:'28px 24px',boxShadow:'var(--shadow-page)',position:'relative'}}>
              <div className="deco-stitches"/>
              <div className="section-label" style={{color:'var(--energy)'}}>🐻 Combat contre l'Ours !</div>
              <p style={{fontFamily:'var(--font-type)',fontSize:'12px',color:'var(--ink-soft)',marginBottom:'16px'}}>Score joueur ≥ ours → pas de dégâts. Score joueur &lt; ours → -5 Énergie.</p>
              <div style={{marginBottom:'14px'}}>
                <div style={{fontFamily:'var(--font-type)',fontSize:'10px',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-faded)'}}>Score de l'Ours (D6)</div>
                <input type="number" min="1" max="6" value={bearOurs} onChange={e=>setBearOurs(e.target.value)} className="die-input"/>
              </div>
              <div style={{marginBottom:'16px',display:'flex',flexDirection:'column',gap:'8px'}}>
                {gs.players.filter(p=>!p.isKO).map(p=>(
                  <div key={p.id} style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    <span style={{fontFamily:'var(--font-serif)',fontSize:'14px',minWidth:'80px',color:'var(--ink)'}}>{p.name}</span>
                    <input type="number" min="1" max="6" value={bearScores[p.id]||''} onChange={e=>setBearScores(prev=>({...prev,[p.id]:e.target.value}))} className="die-input" style={{width:'64px'}} placeholder="D6"/>
                    {bearScores[p.id]&&bearOurs&&(
                      <span style={{fontFamily:'var(--font-type)',fontSize:'12px',fontWeight:'bold',color:parseInt(bearScores[p.id])>=parseInt(bearOurs)?'var(--ink-green)':'var(--ink-red)'}}>
                        {parseInt(bearScores[p.id])>=parseInt(bearOurs)?'✓ OK':'⚡ -5'}
                      </span>
                    )}
                  </div>
                ))}
              </div>
              <div style={{display:'flex',gap:'10px'}}>
                <button onClick={()=>setShowBear(false)} className="btn" style={{flex:1}}>Annuler</button>
                <button onClick={applyBear} className="btn btn-primary" style={{flex:1}}>Appliquer !</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* INVENTORY MODAL */}
      {showInvModal!==null&&(
        <InventoryModal
          player={gs.players.find(p=>p.id===showInvModal)}
          onClose={()=>setShowInvModal(null)}
          onUpdate={inv=>{upd(prev=>({...prev,players:prev.players.map(p=>p.id===showInvModal?{...p,inventory:inv}:p)}));setShowInvModal(null);}}
        />
      )}
    </div>
  );
}

// ─── REFUGE MODAL ───────────────────────────────────────
function RefugeModal({decision, players, onDecide, onApplyD6}) {
  const [d6Input, setD6Input] = useState('');
  const selectedPlayer = players.find(p=>p.id===decision.selectedPlayerId);
  const outcomes = [
    {range:'1–2',icon:'💥',title:'Passage trop serré',desc:`-10 Énergie pour ${selectedPlayer?.name||'le joueur'}.`,borderColor:'var(--ink-red)',activeBg:'rgba(168,48,42,.08)'},
    {range:'3–4',icon:'🪢',title:'Une Trouvaille !',  desc:'1 Corde récupérée dans le refuge.',               borderColor:'var(--gold)',       activeBg:'rgba(200,157,63,.08)'},
    {range:'5–6',icon:'✨',title:'Jackpot !',          desc:'1 Corde ET 1 Chaufferette.',                       borderColor:'var(--ink-green)',  activeBg:'rgba(58,90,58,.08)'},
  ];
  const activeIdx = d6Input ? parseInt(d6Input)<=2?0:parseInt(d6Input)<=4?1:2 : -1;

  return (
    <div className="modal-overlay">
      <div className="modal-box">
        <div className="paper" style={{borderRadius:'4px',padding:'28px 24px',boxShadow:'var(--shadow-page)',position:'relative'}}>
          <div className="deco-stitches"/>
          <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'18px'}}>
            <span style={{fontFamily:'var(--font-pixel)',fontSize:'40px',lineHeight:1}}>🪨</span>
            <div>
              <div style={{fontFamily:'var(--font-display)',fontSize:'18px',letterSpacing:'.04em',color:'var(--ink-green)'}}>Le Refuge Secret</div>
              <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)'}}>Chapitre 3 — D18 résultat 13–18</div>
            </div>
          </div>

          {decision.phase==='decide'&&(<>
            <p style={{fontFamily:'var(--font-serif)',fontSize:'14px',marginBottom:'4px',color:'var(--ink)'}}>Un passage étroit mène à un refuge. <strong>Qui veut tenter de se faufiler ?</strong></p>
            <p style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-faded)',marginBottom:'14px',fontStyle:'italic'}}>Risqué mais potentiellement très utile. Un seul joueur peut y aller.</p>
            <div style={{display:'flex',flexDirection:'column',gap:'6px',marginBottom:'12px'}}>
              {players.filter(p=>!p.isKO).map(p=>(
                <button key={p.id} onClick={()=>onDecide(p.id)} className="btn"
                  style={{textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center',borderColor:'var(--ink-green)'}}>
                  <span style={{fontFamily:'var(--font-serif)',fontSize:'15px',color:'var(--ink)'}}>{p.name}</span>
                  <span style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)'}}>⚡{p.energy} · 💙{p.moral}</span>
                </button>
              ))}
            </div>
            <button onClick={()=>onDecide(null)} className="btn" style={{width:'100%',color:'var(--ink-faded)'}}>🚶 Personne n'entre — on continue</button>
          </>)}

          {decision.phase==='roll'&&(<>
            <div style={{background:'rgba(58,90,58,.08)',border:'1px solid var(--ink-green)',borderRadius:'2px',padding:'10px 12px',marginBottom:'14px',display:'flex',gap:'10px',alignItems:'center'}}>
              <span style={{fontFamily:'var(--font-pixel)',fontSize:'28px',lineHeight:1}}>🧗</span>
              <div>
                <div style={{fontFamily:'var(--font-display)',fontSize:'14px',color:'var(--ink-green)'}}>{selectedPlayer?.name} se faufile...</div>
                <div style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-faded)'}}>Lancez le D6.</div>
              </div>
            </div>
            <div className="layout-3col" style={{marginBottom:'16px'}}>
              {outcomes.map((o,i)=>(
                <div key={i} style={{border:`2px solid ${o.borderColor}`,borderRadius:'2px',padding:'10px 8px',opacity:activeIdx===-1||activeIdx===i?1:.45,transform:activeIdx===i?'scale(1.04)':'none',transition:'all 150ms',background:activeIdx===i?o.activeBg:'transparent'}}>
                  <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',marginBottom:'3px'}}>{o.range}</div>
                  <div style={{fontFamily:'var(--font-pixel)',fontSize:'24px',lineHeight:1,marginBottom:'3px'}}>{o.icon}</div>
                  <div style={{fontFamily:'var(--font-display)',fontSize:'11px',color:'var(--ink)',marginBottom:'3px'}}>{o.title}</div>
                  <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-soft)',lineHeight:'1.4'}}>{o.desc}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'10px',alignItems:'flex-end'}}>
              <div>
                <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'.1em'}}>Résultat D6</div>
                <input type="number" min="1" max="6" value={d6Input} onChange={e=>setD6Input(e.target.value)} className="die-input" placeholder="1–6"/>
              </div>
              <button onClick={()=>{const r=parseInt(d6Input);if(r>=1&&r<=6)onApplyD6(decision.selectedPlayerId,r);}}
                disabled={!d6Input||parseInt(d6Input)<1||parseInt(d6Input)>6}
                className="btn btn-primary" style={{flex:1,alignSelf:'flex-end'}}>
                Appliquer
              </button>
            </div>
          </>)}
        </div>
      </div>
    </div>
  );
}

// ─── D18 PANEL ──────────────────────────────────────────
function D18Panel({chapter,onApply,appliedResult}) {
  const [input,setInput] = useState('');
  const events = [chapter.d18Events.low, chapter.d18Events.mid, chapter.d18Events.high];
  const activeIdx = appliedResult===null?-1:appliedResult<=6?0:appliedResult<=12?1:2;

  return (
    <div className="card">
      <div className="section-label" style={{color:'var(--ink-blue)'}}>D18 — Événements possibles (lisez avant de lancer)</div>
      <div className="layout-3col" style={{marginBottom:'12px'}}>
        {events.map((evt,i)=>(
          <div key={i} style={{border:`2px solid ${activeIdx===i?'var(--ink-blue)':'var(--paper-edge)'}`,borderRadius:'2px',padding:'10px',opacity:activeIdx===-1||activeIdx===i?1:.5,transition:'all 150ms',background:activeIdx===i?'rgba(42,74,110,.08)':'transparent'}}>
            <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',marginBottom:'4px'}}>{evt.range}</div>
            <div style={{fontFamily:'var(--font-display)',fontSize:'13px',color:'var(--ink)',marginBottom:'6px'}}>{evt.title}</div>
            <div style={{fontFamily:'var(--font-serif)',fontSize:'12px',color:'var(--ink-soft)',fontStyle:'italic',lineHeight:'1.5',marginBottom:'8px',whiteSpace:'pre-line'}}>{evt.story}</div>
            <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:activeIdx===i?'var(--ink-blue)':'var(--ink-faded)',background:'rgba(43,29,18,.04)',padding:'5px 7px',borderRadius:'2px',lineHeight:'1.4'}}>{evt.effectDesc}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
        <input type="number" min="1" max="18" value={input} onChange={e=>setInput(e.target.value)} className="die-input" placeholder="1–18" style={{width:'90px'}}/>
        <button onClick={()=>{const r=parseInt(input);if(r>=1&&r<=18)onApply(r);}} className="btn btn-primary btn-sm">Appliquer D18</button>
        {appliedResult&&(
          <div style={{display:'flex',alignItems:'center',gap:'6px',background:'rgba(42,74,110,.1)',padding:'4px 10px',borderRadius:'2px',border:'1px solid var(--ink-blue)'}}>
            <span style={{fontFamily:'var(--font-pixel)',fontSize:'26px',color:'var(--gold)'}}>{appliedResult}</span>
            <span style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-blue)'}}>{events[activeIdx]?.title}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ITEM GRANT MODAL ──────────────────────────────────
function ItemGrantModal({grant,players,onGrant,remaining}) {
  const res = getRes(grant.resourceId);
  return (
    <div className="modal-overlay">
      <div className="modal-box">
        <div className="paper" style={{borderRadius:'4px',padding:'28px 24px',boxShadow:'var(--shadow-page)',position:'relative'}}>
          <div className="deco-stitches"/>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}}>
            <div style={{fontFamily:'var(--font-display)',fontSize:'18px',letterSpacing:'.04em',color:'var(--gold-deep)'}}>Attribution d'Objet</div>
            {remaining>1&&<span className="badge-ink badge-gold">{remaining} objets</span>}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'16px',background:'rgba(200,157,63,.1)',border:'1px solid var(--paper-stain)',borderRadius:'2px',padding:'12px 16px',marginBottom:'16px'}}>
            <div style={{fontFamily:'var(--font-pixel)',fontSize:'48px',lineHeight:1}}>{res?.icon}</div>
            <div>
              <div style={{fontFamily:'var(--font-display)',fontSize:'18px',color:'var(--ink)'}}>{res?.name}</div>
              <div style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-faded)',marginTop:'3px'}}>Source : {grant.source}</div>
              <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)'}}>Occupe 1 emplacement d'inventaire</div>
            </div>
          </div>
          <div style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-soft)',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'.1em'}}>Qui reçoit cet objet ?</div>
          <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
            {players.filter(p=>!p.isKO).map(p=>{
              const slots=getUsedSlots(p.inventory);
              const full=slots>=MAX_SLOTS;
              return (
                <button key={p.id} onClick={()=>!full&&onGrant(p.id)} disabled={full}
                  className="btn" style={{textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center',opacity:full?.5:1,borderColor:full?'var(--paper-edge)':undefined}}>
                  <div>
                    <div style={{fontFamily:'var(--font-serif)',fontSize:'15px',color:'var(--ink)'}}>{p.name}</div>
                    <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)'}}>⚡{p.energy} · 💙{p.moral}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontFamily:'var(--font-pixel)',fontSize:'16px',color:full?'var(--ink-red)':'var(--ink-green)'}}>{slots}/{MAX_SLOTS}</div>
                    <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)'}}>{full?'plein':'libre'}</div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── MASTER PLAYER CARD ─────────────────────────────────
function MasterPlayerCard({player,onEdit,onStat}) {
  return (
    <div className={`card${player.isKO?' player-ko':''}`} style={{padding:'10px 12px',borderColor:player.isKO?'var(--ink-red)':undefined}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px',gap:'6px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
          {player.costume
            ? <CharacterSprite hat={player.costume.hat} shirt={player.costume.shirt} shoes={player.costume.shoes} size={1}/>
            : null}
          <div style={{fontFamily:'var(--font-serif)',fontSize:'14px',fontWeight:600,color:player.isKO?'var(--ink-red)':'var(--ink)'}}>
            {player.isKO?'✝ ':''}{player.name}
          </div>
        </div>
        <button onClick={onEdit} className="btn btn-sm" style={{padding:'2px 8px',fontSize:'9px',flexShrink:0}}>✎ Inv.</button>
      </div>
      {[['energy','Énergie'],['moral','Moral']].map(([k,l])=>(
        <div key={k} style={{display:'flex',alignItems:'center',gap:'5px',marginBottom:'6px'}}>
          <span style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',width:'44px'}}>{l}</span>
          <div className={`bar ${k}`} style={{flex:1}}><span style={{width:`${player[k]}%`}}/></div>
          <button onClick={()=>onStat(k,-5)} className="btn btn-sm btn-red" style={{padding:'1px 5px',fontSize:'9px',boxShadow:'1px 1px 0 var(--ink-red)'}}>-5</button>
          <span style={{fontFamily:'var(--font-pixel)',fontSize:'16px',width:'28px',textAlign:'center',color:'var(--ink)'}}>{player[k]}</span>
          <button onClick={()=>onStat(k,5)} className="btn btn-sm btn-green" style={{padding:'1px 5px',fontSize:'9px',boxShadow:'1px 1px 0 var(--ink-green)'}}>+5</button>
        </div>
      ))}
      <div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginTop:'4px'}}>
        {player.inventory.map((item,idx)=>{const r=getRes(item.resourceId);return(
          <span key={idx} className={`inv-slot${item.wet?' wet':' filled'}`}
            style={{minHeight:'auto',padding:'2px 6px',flexDirection:'row',fontSize:'10px',minWidth:'auto',gap:'2px'}}>
            {r?.icon} {r?.name?.split(' ')[0]}{item.portions!=null?`×${item.portions}`:''}
          </span>
        );})}
        {player.bonusMoral&&<span className="inv-slot filled"
          style={{minHeight:'auto',padding:'2px 6px',flexDirection:'row',fontSize:'10px',minWidth:'auto',borderColor:'var(--gold)',background:'rgba(200,157,63,.15)',gap:'2px'}}>🙏</span>}
      </div>
    </div>
  );
}

// ─── INVENTORY MODAL ────────────────────────────────────
function InventoryModal({player,onClose,onUpdate}) {
  const [inv,setInv] = useState([...player.inventory]);
  const [addId,setAddId] = useState('sandwich');
  return (
    <div className="modal-overlay">
      <div className="modal-box">
        <div className="paper" style={{borderRadius:'4px',padding:'28px 24px',boxShadow:'var(--shadow-page)',position:'relative'}}>
          <div className="deco-stitches"/>
          <div style={{fontFamily:'var(--font-display)',fontSize:'18px',marginBottom:'4px',color:'var(--ink)'}}>{player.name} — Inventaire</div>
          <div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',marginBottom:'14px'}}>{getUsedSlots(inv)}/{MAX_SLOTS} emplacements utilisés</div>
          <div style={{display:'flex',flexDirection:'column',gap:'6px',marginBottom:'14px',maxHeight:'200px',overflowY:'auto'}}>
            {inv.map((item,idx)=>{const r=getRes(item.resourceId);return(
              <div key={idx} style={{display:'flex',alignItems:'center',gap:'8px',background:'rgba(43,29,18,.05)',border:'1px solid var(--paper-edge)',borderRadius:'2px',padding:'6px 10px'}}>
                <span style={{fontFamily:'var(--font-pixel)',fontSize:'20px'}}>{r?.icon}</span>
                <span style={{flex:1,fontFamily:'var(--font-type)',fontSize:'12px',color:'var(--ink)'}}>{r?.name}{item.portions!=null?` (${item.portions} portions)`:''}</span>
                <button onClick={()=>setInv(p=>p.map((it,i)=>i===idx?{...it,wet:!it.wet}:it))} className="btn btn-sm"
                  style={{fontSize:'11px',padding:'2px 6px',borderColor:item.wet?'var(--ink-blue)':undefined,color:item.wet?'var(--ink-blue)':undefined}}>💧</button>
                <button onClick={()=>setInv(p=>p.filter((_,i)=>i!==idx))} className="btn btn-sm btn-red" style={{fontSize:'11px',padding:'2px 6px'}}>✕</button>
              </div>
            );})}
            {inv.length===0&&<p style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-faded)',fontStyle:'italic',textAlign:'center',padding:'12px 0'}}>Inventaire vide</p>}
          </div>
          <div style={{display:'flex',gap:'8px',marginBottom:'14px'}}>
            <select value={addId} onChange={e=>setAddId(e.target.value)}
              style={{flex:1,fontFamily:'var(--font-type)',fontSize:'12px',color:'var(--ink)',background:'var(--paper-light)',border:'1px solid var(--paper-edge)',borderRadius:'2px',padding:'6px 8px',outline:'none'}}>
              {Object.values(RESOURCES).map(r=><option key={r.id} value={r.id}>{r.icon} {r.name}</option>)}
            </select>
            <button onClick={()=>{const r=getRes(addId);if(r)setInv(p=>[...p,{resourceId:r.id,portions:r.hasPortions?3:null,wet:false}]);}} className="btn btn-green btn-sm">+ Ajouter</button>
          </div>
          <div style={{display:'flex',gap:'10px'}}>
            <button onClick={onClose} className="btn" style={{flex:1}}>Annuler</button>
            <button onClick={()=>onUpdate(inv)} className="btn btn-primary" style={{flex:1}}>Sauvegarder</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// PLAYER SCREEN
// ═══════════════════════════════════════════════════════
function PlayerScreen({gs,onBack}) {
  const ch = CHAPTERS[gs.currentChapter];
  if (gs.interChapterSummary) return <BetweenChapters summary={gs.interChapterSummary} chapter={ch} players={gs.players} />;

  return (
    <div style={{height:'100vh',display:'flex',overflow:'hidden',background:'#1a0e05'}}>

      {/* GAME OVER MODAL */}
      {gs.gameOver&&(
        <div className="modal-overlay">
          <div className="modal-box">
            <div className="paper" style={{borderRadius:'4px',padding:'48px 36px',textAlign:'center',boxShadow:'var(--shadow-page)',position:'relative'}}>
              <div className="deco-stitches"/>
              <div style={{fontFamily:'var(--font-pixel)',fontSize:'80px',lineHeight:1}}>✝</div>
              <h2 style={{fontFamily:'var(--font-display)',fontSize:'28px',color:'var(--ink-red)',margin:'16px 0 12px',letterSpacing:'.04em'}}>Fin de Partie</h2>
              <p style={{fontFamily:'var(--font-serif)',fontSize:'16px',color:'var(--ink-soft)'}}>{gs.gameOverReason}</p>
            </div>
          </div>
        </div>
      )}

      {/* ─── PAGE GAUCHE ─── */}
      <div style={{flex:'0 0 40%',display:'flex',flexDirection:'column',background:'linear-gradient(108deg,#ede2c0 0%,#f5ead2 40%,#e8d8b0 100%)',boxShadow:'inset -14px 0 30px rgba(90,60,20,.22)',overflow:'hidden',padding:'26px 28px 18px 32px'}}>

        {/* En-tête chapitre */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
          <div style={{fontFamily:'var(--font-type)',fontSize:'10px',letterSpacing:'.18em',color:'var(--ink-faded)',textTransform:'uppercase'}}>
            Chapitre {String(gs.currentChapter).padStart(2,'0')} / 12
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:'var(--font-type)',fontSize:'8px',letterSpacing:'.18em',color:'var(--ink-faded)',textTransform:'uppercase'}}>Altitude</div>
            <div style={{fontFamily:'var(--font-hand-bold)',fontSize:'20px',color:'var(--ink)',lineHeight:1}}>{gs.currentAltitude}<span style={{fontSize:'11px'}}> m</span></div>
          </div>
        </div>

        {/* Titre */}
        <div style={{fontFamily:'var(--font-display)',fontSize:'clamp(20px,2.6vw,34px)',color:'var(--ink)',letterSpacing:'.03em',lineHeight:1.05,marginBottom:'8px'}}>{ch?.title}</div>

        {/* Filet */}
        <div style={{height:'1px',background:'linear-gradient(90deg,var(--ink) 0%,transparent 85%)',opacity:.35,marginBottom:'12px'}}/>

        {/* Scène — zone image */}
        <div style={{flex:1,background:'#0d0810',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:'10px',border:'1px solid rgba(43,29,18,.25)',overflow:'hidden',position:'relative'}}>
          <div style={{textAlign:'center',padding:'16px',position:'relative',zIndex:1}}>
            <div style={{fontFamily:'var(--font-pixel)',fontSize:'clamp(60px,7vw,88px)',lineHeight:1,filter:'drop-shadow(0 3px 10px rgba(0,0,0,.6))'}}>{chEmoji(gs.currentChapter)}</div>
            <div style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'rgba(200,180,140,.55)',marginTop:'8px',letterSpacing:'.12em',textTransform:'uppercase'}}>{ch?.weather}</div>
          </div>
        </div>

        {/* Légende + page */}
        <div style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:'11px',color:'var(--ink-soft)',textAlign:'center',marginBottom:'6px'}}>
          — {ch?.title?.toLowerCase()} —
        </div>
        <div style={{fontFamily:'var(--font-type)',fontSize:'9px',color:'var(--ink-faded)',textAlign:'center',letterSpacing:'.1em'}}>
          — page {gs.currentChapter * 2} —
        </div>
      </div>

      {/* ─── SPINE ─── */}
      <div style={{width:'16px',flexShrink:0,background:'linear-gradient(90deg,#2e1a06 0%,#7a4a18 28%,#c08428 50%,#7a4a18 72%,#2e1a06 100%)',boxShadow:'inset 0 0 8px rgba(0,0,0,.6),2px 0 5px rgba(0,0,0,.25),-2px 0 5px rgba(0,0,0,.25)'}}/>

      {/* ─── PAGE DROITE ─── */}
      <div style={{flex:1,display:'flex',flexDirection:'column',background:'linear-gradient(252deg,#ede2c0 0%,#f5ead2 40%,#e8d8b0 100%)',boxShadow:'inset 14px 0 30px rgba(90,60,20,.18)',padding:'26px 32px 18px 26px',overflowY:'auto'}}>

        {/* Narration avec lettrine */}
        <div className="narrative" style={{marginBottom:'14px'}}>
          <p style={{fontFamily:'var(--font-serif)',fontSize:'13px',lineHeight:'1.68',color:'var(--ink)',margin:0,whiteSpace:'pre-line'}}>{ch?.narrativeSummary}</p>
        </div>

        {/* Que décide l'équipe ? */}
        <div style={{fontFamily:'var(--font-type)',fontSize:'9px',letterSpacing:'.18em',color:'var(--ink-faded)',textTransform:'uppercase',marginBottom:'8px'}}>
          Que décide l'équipe ?
        </div>
        <div style={{marginBottom:'14px'}}>
          {ch?.choices.map(choice=>{
            const avail=isChoiceAvail(choice,gs);
            const chosen=gs.choiceMade&&gs.lastChoiceLabel===choice.label;
            const letter=String.fromCharCode(64+choice.id);
            return (
              <div key={choice.id} style={{display:'flex',alignItems:'center',gap:'12px',padding:'5px 6px',borderBottom:'1px solid rgba(43,29,18,.1)',opacity:avail||chosen?1:.42}}>
                <span style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:'18px',lineHeight:1,color:chosen?'var(--gold)':avail?'var(--ink)':'var(--ink-faded)',width:'14px',flexShrink:0,textAlign:'center'}}>{letter}</span>
                <span style={{fontFamily:'var(--font-type)',fontSize:'11px',flex:1,color:chosen?'var(--gold-deep)':avail?'var(--ink)':'var(--ink-faded)'}}>{choice.label}</span>
                {chosen&&<span style={{fontFamily:'var(--font-pixel)',fontSize:'16px',color:'var(--gold)',flexShrink:0}}>★</span>}
              </div>
            );
          })}
        </div>

        {/* Résultats dés / choix */}
        {(gs.lastD18Result||gs.choiceMade)&&(
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'12px'}}>
            {gs.lastD18Result&&(
              <div style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'5px 10px',background:'rgba(42,74,110,.09)',border:'1px solid rgba(42,74,110,.28)',borderRadius:'2px'}}>
                <span style={{fontFamily:'var(--font-pixel)',fontSize:'24px',color:'var(--ink-blue)',lineHeight:1}}>D18 · {gs.lastD18Result}</span>
                <span style={{fontFamily:'var(--font-serif)',fontSize:'11px',color:'var(--ink-soft)'}}>{gs.lastD18Title}</span>
              </div>
            )}
            {gs.choiceMade&&(
              <div style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'5px 10px',background:'rgba(58,90,58,.09)',border:'1px solid rgba(58,90,58,.3)',borderRadius:'2px'}}>
                <span style={{fontFamily:'var(--font-pixel)',fontSize:'16px',color:'var(--ink-green)'}}>🎯</span>
                <span style={{fontFamily:'var(--font-display)',fontSize:'12px',color:'var(--ink-green)'}}>{gs.lastChoiceLabel}</span>
              </div>
            )}
          </div>
        )}

        {/* L'Équipée */}
        <div style={{fontFamily:'var(--font-type)',fontSize:'9px',letterSpacing:'.18em',color:'var(--ink-faded)',textTransform:'uppercase',marginBottom:'8px',paddingBottom:'5px',borderBottom:'1px solid var(--ink)'}}>
          L'Équipée — État des Forces
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',flex:1}}>
          {gs.players.map(p=><PlayerCard key={p.id} player={p}/>)}
        </div>

        {/* Bas de page */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'10px'}}>
          <button onClick={onBack} className="btn btn-sm" style={{fontSize:'9px',padding:'2px 8px',opacity:.7}}>← Menu</button>
          <div style={{fontFamily:'var(--font-type)',fontSize:'9px',color:'var(--ink-faded)',letterSpacing:'.1em'}}>— page {gs.currentChapter*2+1} —</div>
          <div style={{width:'60px'}}/>
        </div>
      </div>
    </div>
  );
}

// ─── BETWEEN CHAPTERS ───────────────────────────────────
function BetweenChapters({summary,chapter,players}) {
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px'}}>
      <div className="paper" style={{maxWidth:'560px',width:'100%',borderRadius:'4px',padding:'40px 36px',boxShadow:'var(--shadow-page)',position:'relative'}}>
        <div className="deco-stitches"/>
        <div style={{textAlign:'center',marginBottom:'28px'}}>
          <div style={{fontFamily:'var(--font-pixel)',fontSize:'64px',lineHeight:1,marginBottom:'10px'}}>🌙</div>
          <div style={{fontFamily:'var(--font-display)',fontSize:'28px',letterSpacing:'.04em',color:'var(--ink)',marginBottom:'4px'}}>Fin de Journée</div>
          <div style={{fontFamily:'var(--font-hand)',fontSize:'18px',color:'var(--ink-soft)'}}>{chapter?.title}</div>
        </div>

        <div className="card" style={{marginBottom:'16px'}}>
          <div className="section-label">Ce qui s'est passé</div>
          <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
            {summary.events.map((evt,i)=>(
              <div key={i} style={{display:'flex',alignItems:'flex-start',gap:'10px'}}>
                <span style={{fontFamily:'var(--font-pixel)',fontSize:'20px',lineHeight:1,flexShrink:0,marginTop:'2px'}}>{evt.icon}</span>
                <span style={{fontFamily:'var(--font-type)',fontSize:'12px',color:'var(--ink-soft)',lineHeight:'1.55'}}>{evt.text}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{marginBottom:'18px'}}>
          <div className="section-label">État de l'équipe</div>
          <div className="layout-2col">
            {players.map(p=>(
              <div key={p.id} className="card" style={{padding:'10px 12px',opacity:p.isKO?.5:1,borderColor:p.isKO?'var(--ink-red)':undefined}}>
                <div style={{fontFamily:'var(--font-serif)',fontSize:'14px',fontWeight:600,marginBottom:'7px',color:p.isKO?'var(--ink-red)':'var(--ink)'}}>
                  {p.isKO?'✝ ':''}{p.name}
                </div>
                {p.isKO
                  ?<div style={{fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-red)'}}>Évanoui(e)</div>
                  :(<>
                    <div className="bar energy" style={{marginBottom:'5px'}}><span style={{width:`${p.energy}%`}}/></div>
                    <div className="bar moral"><span style={{width:`${p.moral}%`}}/></div>
                    <div style={{display:'flex',justifyContent:'space-between',fontFamily:'var(--font-type)',fontSize:'10px',color:'var(--ink-faded)',marginTop:'4px'}}>
                      <span>⚡ {p.energy}</span><span>💙 {p.moral}</span>
                    </div>
                  </>)
                }
              </div>
            ))}
          </div>
        </div>

        <p style={{fontFamily:'var(--font-type)',fontSize:'11px',color:'var(--ink-faded)',textAlign:'center',fontStyle:'italic'}}>⏳ En attente du Narrateur pour continuer...</p>
      </div>
    </div>
  );
}

// ─── PLAYER CARD (book layout — horizontal) ─────────────
function PlayerCard({player}) {
  const isKO=player.isKO;
  const slots=player.inventory.filter(i=>!getRes(i.resourceId)?.noSlot);
  return (
    <div style={{display:'flex',gap:'8px',padding:'8px 10px',border:`1px solid ${isKO?'var(--ink-red)':'var(--paper-edge)'}`,borderRadius:'2px',background:'rgba(43,29,18,.04)',opacity:isKO?.55:1}}>
      {/* Sprite */}
      <div style={{flexShrink:0,paddingTop:'2px'}}>
        {player.costume
          ? <CharacterSprite hat={player.costume.hat} shirt={player.costume.shirt} shoes={player.costume.shoes} size={2}/>
          : <span style={{fontFamily:'var(--font-pixel)',fontSize:'28px',lineHeight:1}}>{isKO?'💀':'🧗'}</span>}
      </div>
      {/* Stats column */}
      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:'3px'}}>
        {/* Name + role */}
        <div style={{lineHeight:1,marginBottom:'1px'}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:'14px',color:isKO?'var(--ink-red)':'var(--ink)',letterSpacing:'.03em'}}>{isKO?'✝ ':''}{player.name}</div>
          {player.role&&<div style={{fontFamily:'var(--font-type)',fontSize:'8px',color:'var(--ink-faded)',textTransform:'uppercase',letterSpacing:'.12em',marginTop:'1px'}}>{player.role}</div>}
        </div>
        {!isKO&&(<>
          {/* Bars */}
          <div style={{display:'flex',alignItems:'center',gap:'4px'}}>
            <span style={{fontFamily:'var(--font-type)',fontSize:'7px',color:'var(--ink-faded)',width:'18px',flexShrink:0,letterSpacing:'.06em'}}>ÉN.</span>
            <div className="bar energy" style={{flex:1,height:'5px'}}><span style={{width:`${player.energy}%`}}/></div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'4px',marginBottom:'4px'}}>
            <span style={{fontFamily:'var(--font-type)',fontSize:'7px',color:'var(--ink-faded)',width:'18px',flexShrink:0,letterSpacing:'.06em'}}>MOR.</span>
            <div className="bar moral" style={{flex:1,height:'5px'}}><span style={{width:`${player.moral}%`}}/></div>
          </div>
          {/* Inventory */}
          <div style={{display:'flex',gap:'2px'}}>
            {Array.from({length:MAX_SLOTS}).map((_,si)=>{
              const item=slots[si]; const r=item?getRes(item.resourceId):null;
              return (
                <div key={si} style={{width:'20px',height:'20px',border:`1px ${item?'solid':'dashed'} ${item?'var(--paper-stain)':'var(--paper-edge)'}`,borderRadius:'2px',display:'flex',alignItems:'center',justifyContent:'center',background:item?'rgba(200,157,63,.08)':'transparent',fontSize:'13px',fontFamily:'var(--font-pixel)',position:'relative',flexShrink:0}}>
                  {item?(<>
                    <span style={{lineHeight:1,opacity:item.wet?.5:1}}>{r?.icon||'?'}</span>
                    {item.portions!=null&&<span style={{position:'absolute',bottom:0,right:'1px',fontSize:'6px',fontFamily:'var(--font-type)',color:'var(--ink)',background:'rgba(241,231,207,.9)',padding:'0 1px',lineHeight:1.2,borderRadius:'1px'}}>{item.portions}</span>}
                  </>):<span style={{color:'var(--paper-edge)',fontSize:'8px'}}>—</span>}
                </div>
              );
            })}
          </div>
          {player.bonusMoral&&<div style={{fontFamily:'var(--font-type)',fontSize:'8px',color:'var(--gold-deep)'}}>🙏 Béni</div>}
        </>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
